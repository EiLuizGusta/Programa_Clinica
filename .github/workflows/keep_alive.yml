name: Manter Render Acordado

on:
  schedule:
    # Roda a cada 12 minutos, todos os dias
    - cron: '*/12 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # <-- Esta linha mágica cria o botão manual!

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dar um ping no backend do Render
        run: |
          curl -I https://programa-clinica-backend.onrender.com/